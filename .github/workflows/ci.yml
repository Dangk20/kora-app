# KORA — integración y despliegue continuos
#
# Ver openspec/changes/vps-two-stack-deploy — specs/continuous-deployment.
#
# Cadena: verificación → imagen → pruebas (automático) → producción (aprobación manual).
# Ninguna imagen se construye si la verificación no pasó: si falla, el entorno
# conserva la versión anterior.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      desplegar_produccion:
        description: "Desplegar a PRODUCCIÓN (exige aprobación del entorno)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Verificación — la compuerta. Nada se despliega si esto falla.
  # ─────────────────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_ci
          POSTGRES_DB: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kora:kora_ci@localhost:5432/kora?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ─────────────────────────────────────────────────────────────
  # 2. Imagen — etiquetada con el hash del commit
  # ─────────────────────────────────────────────────────────────
  # Se construye AQUÍ y no en el servidor: compilar Next consume CPU de forma
  # intensiva y el VPS tiene 2 núcleos compartidos entre dos entornos y el borde
  # (design.md decisión 1). Además, los ejecutores son x86_64 como el servidor:
  # una imagen construida en un equipo Apple Silicon no arrancaría allí.
  imagen:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      etiqueta: ${{ steps.meta.outputs.etiqueta }}
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "etiqueta=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # ghcr.io EXIGE minúsculas y el usuario del repo es "Dangk20":
          # ghcr.io/Dangk20/... es un nombre inválido y el push falla.
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tres imágenes desde el mismo Dockerfile: la aplicación, el contenedor
      # efímero que aplica migraciones, y el consumidor de eventos.
      - name: Aplicación
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}/app:${{ steps.meta.outputs.etiqueta }}
            ${{ steps.meta.outputs.imagen }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrador
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}/migrator:${{ steps.meta.outputs.etiqueta }}
            ${{ steps.meta.outputs.imagen }}/migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El worker NO puede salir de `runner`: esa imagen es la salida standalone
      # de Next, sin `tsx` ni `scripts/`. Objetivo propio en el mismo Dockerfile.
      - name: Worker de eventos
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}/worker:${{ steps.meta.outputs.etiqueta }}
            ${{ steps.meta.outputs.imagen }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3. Pruebas — automático en cada integración a main
  # ─────────────────────────────────────────────────────────────
  desplegar-pruebas:
    needs: imagen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.korashopp.com
    steps:
      - name: Desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: ETIQUETA,GHCR_TOKEN,GHCR_USER,IMAGEN_BASE
          script: |
            bash ~/kora/deploy/desplegar.sh staging "$IMAGEN_BASE" "$ETIQUETA" "$GHCR_USER" "$GHCR_TOKEN"
        env:
          ETIQUETA: ${{ needs.imagen.outputs.etiqueta }}
          IMAGEN_BASE: ${{ needs.imagen.outputs.imagen }}
          GHCR_USER: ${{ github.actor }}
          # Token efímero del propio flujo: no queda ninguna credencial
          # permanente del registro guardada en el servidor.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que responde
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://test.korashopp.com/ || true)
            # 401 es correcto: el entorno de pruebas exige autenticación.
            if [ "$code" = "401" ]; then echo "✅ pruebas responde ($code)"; exit 0; fi
            sleep 6
          done
          echo "❌ pruebas no respondió tras el despliegue"; exit 1

  # ─────────────────────────────────────────────────────────────
  # 4. Producción — SOLO con aprobación humana
  # ─────────────────────────────────────────────────────────────
  # `environment: production` es lo que fuerza la aprobación: no hay combinación
  # de eventos del repositorio que publique en producción sin que una persona
  # lo autorice (specs/continuous-deployment).
  desplegar-produccion:
    needs: [imagen, desplegar-pruebas]
    if: github.event_name == 'workflow_dispatch' && inputs.desplegar_produccion
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://korashopp.com
    steps:
      - name: Desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: ETIQUETA,GHCR_TOKEN,GHCR_USER,IMAGEN_BASE
          script: |
            bash ~/kora/deploy/desplegar.sh production "$IMAGEN_BASE" "$ETIQUETA" "$GHCR_USER" "$GHCR_TOKEN"
        env:
          ETIQUETA: ${{ needs.imagen.outputs.etiqueta }}
          IMAGEN_BASE: ${{ needs.imagen.outputs.imagen }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
