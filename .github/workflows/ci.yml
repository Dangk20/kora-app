# KORA — integración y despliegue continuos
#
# Ver openspec/changes/vps-two-stack-deploy — specs/continuous-deployment.
#
# **PRUEBAS se despliega solo, en cada integración a `main`** (7 ago 2026).
# Antes había que entrar a la interfaz de GitHub y pedirlo a mano: con varios
# arreglos seguidos eso son minutos de espera por cada uno, y en un día con
# presentación costó tiempo real. El argumento de "desplegar en cada commit es
# ruido" era cierto cuando nadie miraba pruebas; ahora el cliente sí lo mira, y
# lo caro pasó a ser lo contrario — que un arreglo se quede en el repositorio.
#
# **PRODUCCIÓN sigue siendo a mano y con aprobación humana.** Eso no cambia, y
# no debe cambiar: `environment: production` es lo que lo garantiza.
#
# Cadena al desplegar: verificación → imágenes → configuración → pruebas.
# La verificación sigue siendo la COMPUERTA: si falla, no se construye nada.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nocturno: 02:00 en Colombia (07:00 UTC). Deja el entorno de pruebas al día
  # cada mañana sin que nadie tenga que pedirlo.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      desplegar_pruebas:
        description: "Desplegar a PRUEBAS (test.korashopp.com)"
        type: boolean
        default: true
      desplegar_produccion:
        description: "Desplegar a PRODUCCIÓN (exige aprobación del entorno)"
        type: boolean
        default: false

# Dos integraciones seguidas no pueden desplegar a la vez: el guion de
# despliegue recrea contenedores, y dos a la vez sobre el mismo servidor dejan
# un estado que nadie eligió.
#
# En `main` las ejecuciones se ENCOLAN (no se cancelan): cancelar a mitad de un
# despliegue es peor que esperar. En pull requests sí se cancela la anterior,
# porque ahí solo se verifica y lo que importa es la respuesta rápida.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Verificación — la compuerta. Nada se despliega si esto falla.
  # ─────────────────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_ci
          POSTGRES_DB: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kora:kora_ci@localhost:5432/kora?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ─────────────────────────────────────────────────────────────
  # 2. Imagen — etiquetada con el hash del commit
  # ─────────────────────────────────────────────────────────────
  # Se construye AQUÍ y no en el servidor: compilar Next consume CPU de forma
  # intensiva y el VPS tiene 2 núcleos compartidos entre dos entornos y el borde
  # (design.md decisión 1). Además, los ejecutores son x86_64 como el servidor:
  # una imagen construida en un equipo Apple Silicon no arrancaría allí.
  imagen:
    needs: ci
    # Se despliega a pruebas cuando:
    #   · llega trabajo a `main` (lo normal desde el 7 ago),
    #   · el nocturno, que además ensaya a diario el camino de recuperación,
    #   · o alguien lo pide a mano.
    #
    # `github.ref` NO sobra pese al filtro de `on.push`: sin él, un `push` de
    # etiqueta desplegaría. Y las pull requests nunca despliegan — verificar el
    # trabajo de otro no puede tocar un servidor que el cliente está mirando.
    #
    # Escape: si el mensaje del commit lleva `[sin desplegar]`, se verifica y no
    # se despliega. Para subir notas o documentación sin gastar el ciclo.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       !contains(github.event.head_commit.message, '[sin desplegar]')) ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.desplegar_pruebas || inputs.desplegar_produccion))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      etiqueta: ${{ steps.meta.outputs.etiqueta }}
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "etiqueta=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # ghcr.io EXIGE minúsculas y el usuario del repo es "Dangk20":
          # ghcr.io/Dangk20/... es un nombre inválido y el push falla.
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tres imágenes desde el mismo Dockerfile: la aplicación, el contenedor
      # efímero que aplica migraciones, y el consumidor de eventos.
      - name: Aplicación
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}/app:${{ steps.meta.outputs.etiqueta }}
            ${{ steps.meta.outputs.imagen }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrador
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}/migrator:${{ steps.meta.outputs.etiqueta }}
            ${{ steps.meta.outputs.imagen }}/migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El worker NO puede salir de `runner`: esa imagen es la salida standalone
      # de Next, sin `tsx` ni `scripts/`. Objetivo propio en el mismo Dockerfile.
      - name: Worker de eventos
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}/worker:${{ steps.meta.outputs.etiqueta }}
            ${{ steps.meta.outputs.imagen }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3. Pruebas — nocturno o bajo petición
  # ─────────────────────────────────────────────────────────────
  desplegar-pruebas:
    needs: imagen
    # Las mismas condiciones que construyeron la imagen, menos la de producción:
    # pedir SOLO producción no debe arrastrar un despliegue a pruebas.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       !contains(github.event.head_commit.message, '[sin desplegar]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.desplegar_pruebas)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.korashopp.com
    steps:
      # La configuración del servidor viaja con cada despliegue.
      # Sin esto el flujo solo llevaría IMÁGENES: cualquier corrección del
      # compose, del Caddyfile o del propio guion de despliegue se quedaría en
      # el repositorio, y el servidor seguiría corriendo la versión con la que
      # se montó a mano. Es lo contrario de "el servidor se reconstruye desde el
      # repositorio", que es la única vía de recuperación que tenemos.
      #
      # Se copian SOLO los archivos versionados: los `.env.*` y `auth.caddy`
      # reales viven únicamente en el servidor y no se tocan.
      # Sin esto el runner no tiene los archivos: los trabajos de despliegue no
      # heredan el espacio de trabajo del trabajo que compiló la imagen.
      - uses: actions/checkout@v4

      - name: Sincronizar configuración de despliegue
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes"
          # tar sobre SSH y no una acción de terceros: el manejo de rutas de scp
          # es difícil de verificar sin poder ejecutarlo, y esto es exactamente
          # lo que hace falta — copiar un árbol de archivos, sin sorpresas.
          #
          # Se envían SOLO los archivos versionados: los .env.* y auth.caddy
          # reales viven únicamente en el servidor y no se tocan.
          tar czf - -C deploy \
            Caddyfile desplegar.sh README.md holding \
            docker-compose.edge.yml docker-compose.staging.yml docker-compose.prod.yml \
            .env.edge.example .env.staging.example .env.production.example auth.caddy.example \
            | $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'mkdir -p ~/kora/deploy && tar xzf - -C ~/kora/deploy && chmod +x ~/kora/deploy/desplegar.sh && echo "configuración sincronizada:" && ls ~/kora/deploy'

      - name: Desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: ETIQUETA,GHCR_TOKEN,GHCR_USER,IMAGEN_BASE
          script: |
            bash ~/kora/deploy/desplegar.sh staging "$IMAGEN_BASE" "$ETIQUETA" "$GHCR_USER" "$GHCR_TOKEN"
        env:
          ETIQUETA: ${{ needs.imagen.outputs.etiqueta }}
          IMAGEN_BASE: ${{ needs.imagen.outputs.imagen }}
          GHCR_USER: ${{ github.actor }}
          # Token efímero del propio flujo: no queda ninguna credencial
          # permanente del registro guardada en el servidor.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que responde
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://test.korashopp.com/ || true)
            # 401 es correcto: el entorno de pruebas exige autenticación.
            if [ "$code" = "401" ]; then echo "✅ pruebas responde ($code)"; exit 0; fi
            sleep 6
          done
          echo "❌ pruebas no respondió tras el despliegue"; exit 1

  # ─────────────────────────────────────────────────────────────
  # 4. Producción — SOLO con aprobación humana
  # ─────────────────────────────────────────────────────────────
  # `environment: production` es lo que fuerza la aprobación: no hay combinación
  # de eventos del repositorio que publique en producción sin que una persona
  # lo autorice (specs/continuous-deployment).
  desplegar-produccion:
    # Depende solo de la imagen: producción no puede quedar bloqueada porque el
    # despliegue a pruebas no se haya pedido en la misma ejecución.
    needs: imagen
    if: github.event_name == 'workflow_dispatch' && inputs.desplegar_produccion
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://korashopp.com
    steps:
      # La configuración del servidor viaja con cada despliegue.
      # Sin esto el flujo solo llevaría IMÁGENES: cualquier corrección del
      # compose, del Caddyfile o del propio guion de despliegue se quedaría en
      # el repositorio, y el servidor seguiría corriendo la versión con la que
      # se montó a mano. Es lo contrario de "el servidor se reconstruye desde el
      # repositorio", que es la única vía de recuperación que tenemos.
      #
      # Se copian SOLO los archivos versionados: los `.env.*` y `auth.caddy`
      # reales viven únicamente en el servidor y no se tocan.
      # Sin esto el runner no tiene los archivos: los trabajos de despliegue no
      # heredan el espacio de trabajo del trabajo que compiló la imagen.
      - uses: actions/checkout@v4

      - name: Sincronizar configuración de despliegue
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes"
          # tar sobre SSH y no una acción de terceros: el manejo de rutas de scp
          # es difícil de verificar sin poder ejecutarlo, y esto es exactamente
          # lo que hace falta — copiar un árbol de archivos, sin sorpresas.
          #
          # Se envían SOLO los archivos versionados: los .env.* y auth.caddy
          # reales viven únicamente en el servidor y no se tocan.
          tar czf - -C deploy \
            Caddyfile desplegar.sh README.md holding \
            docker-compose.edge.yml docker-compose.staging.yml docker-compose.prod.yml \
            .env.edge.example .env.staging.example .env.production.example auth.caddy.example \
            | $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'mkdir -p ~/kora/deploy && tar xzf - -C ~/kora/deploy && chmod +x ~/kora/deploy/desplegar.sh && echo "configuración sincronizada:" && ls ~/kora/deploy'

      - name: Desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: ETIQUETA,GHCR_TOKEN,GHCR_USER,IMAGEN_BASE
          script: |
            bash ~/kora/deploy/desplegar.sh production "$IMAGEN_BASE" "$ETIQUETA" "$GHCR_USER" "$GHCR_TOKEN"
        env:
          ETIQUETA: ${{ needs.imagen.outputs.etiqueta }}
          IMAGEN_BASE: ${{ needs.imagen.outputs.imagen }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
