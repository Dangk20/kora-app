<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORA — Todo lo que buscas, en un solo lugar</title>
<meta name="description" content="KORA está preparando su tienda en línea. Pequeños detalles, grandes recuerdos. Colombia y Estados Unidos.">
<meta name="theme-color" content="#121212">
<link rel="icon" href="/logo-kora.png" type="image/png">

<meta property="og:type" content="website">
<meta property="og:title" content="KORA — Todo lo que buscas, en un solo lugar">
<meta property="og:description" content="Estamos preparando cada detalle para abrir nuestra tienda en línea.">
<meta property="og:image" content="/logo-kora.png">
<meta property="og:locale" content="es_CO">

<!--
  Página de espera del dominio comercial.
  Change: openspec/changes/vps-two-stack-deploy — specs/holding-page.

  Tres restricciones que no son estéticas y no deben "mejorarse" sin leer la spec:

  1. CERO PETICIONES A TERCEROS. Las fuentes están alojadas en este mismo servidor
     (fonts/), no enlazadas a Google Fonts. La página debe seguir funcionando aunque
     no haya red hacia fuera, y no debe filtrar visitas a un tercero.

  2. NI FORMULARIOS NI CANALES DE CONTACTO. No hay campo de correo (exigiría
     consentimiento, almacenamiento y política de tratamiento de datos que aún no
     existen) ni número de WhatsApp (el comercial sigue sin confirmar por el cliente:
     el que aparece en el prototipo es de prueba).

  3. LA VOZ DEL BRAND BOOK. La marca declara por escrito que "nunca presiona, nunca
     exagera y nunca promete lo que no puede cumplir". Están prohibidas las palabras
     urgente, última oportunidad, compra ya, oferta imperdible, liquidación, barato,
     lujo, imposible y exclusivo.
     Excepción decidida por Daniel el 23 sep 2026: la página lleva UNA cuenta
     regresiva hacia la apertura (lunes 5 oct, 7:30 p.m.; se corrió desde el 25 sep). Es informativa, no presiona:
     no va acompañada de ofertas ni de "no te lo pierdas". La hora vive en
     `data-apertura` del contador y es la ÚNICA que hay que cambiar. Al llegar a
     cero la página no se abre sola —el cambio se hace en el Caddyfile—, así que
     el contador dice que estamos abriendo en vez de quedarse en 00.

  Color y tipografía salen de los tokens de src/app/globals.css.
-->

<style>
  @font-face {
    font-family: "Manrope";
    src: url("/fonts/Manrope-variable.woff2") format("woff2");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Allura";
    src: url("/fonts/Allura-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    /* Paleta oficial KORA — espejo de los tokens de src/app/globals.css */
    --kora-orange: #ff6a00;
    --kora-coral: #ff5a1f;
    --kora-pink: #f2357e;
    --kora-magenta: #c026d3;
    --kora-purple: #7a3db8;
    --kora-black: #121212;
    --kora-beige: #f9f3ee;

    --kora-gradient: linear-gradient(
      135deg,
      var(--kora-orange) 0%,
      var(--kora-coral) 25%,
      var(--kora-pink) 50%,
      var(--kora-magenta) 75%,
      var(--kora-purple) 100%
    );
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background-color: var(--kora-black);
    color: var(--kora-beige);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    position: relative;
    overflow-x: hidden;
  }

  /* Resplandor de marca: el gradiente insinuado, no estampado.
     Se dibuja detrás del contenido y no intercepta el cursor. */
  body::before {
    content: "";
    position: fixed;
    inset: -20% -10% auto -10%;
    height: 70vh;
    background:
      radial-gradient(60% 70% at 22% 0%, rgba(255, 106, 0, 0.28), transparent 70%),
      radial-gradient(55% 65% at 78% 8%, rgba(192, 38, 211, 0.24), transparent 72%),
      radial-gradient(50% 60% at 50% 0%, rgba(122, 61, 184, 0.20), transparent 75%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    gap: 2.25rem;
  }

  .logo {
    width: min(230px, 62vw);
    height: auto;
    display: block;
  }

  .titular {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.25rem, 8.5vw, 4.25rem);
    line-height: 1.04;
    letter-spacing: -0.03em;
    max-width: 16ch;
  }

  /* El gradiente sobre texto solo se usa en tamaños grandes: el manual lo marca
     de bajo contraste en cuerpos pequeños. */
  .titular em {
    font-style: normal;
    background-image: var(--kora-gradient);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  /* Sin `max-width`: las dos líneas de la firma van cada una en UNA sola línea,
     como en la portada del brand book. Un `max-width` en ch las parte en móvil. */
  .bajada {
    margin: 0;
    max-width: none;
  }

  .bajada .linea-uno {
    display: block;
    white-space: nowrap;
    font-weight: 600;
    font-size: clamp(0.8rem, 3.1vw, 1.2rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(249, 243, 238, 0.86);
  }

  /* Allura reproduce el remate manuscrito de la portada del brand book.
     `nowrap` no es capricho tipográfico: partida en dos, la firma deja de leerse
     como firma. El tamaño se ajusta al ancho disponible en vez de romperse. */
  .bajada .linea-dos {
    display: block;
    white-space: nowrap;
    font-family: "Allura", "Manrope", cursive;
    font-size: clamp(2.4rem, 11vw, 4rem);
    line-height: 1.25;
    margin-top: 0.1em;
    padding-bottom: 0.12em;
    background-image: var(--kora-gradient);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  .separador {
    width: 78px;
    height: 2px;
    border: 0;
    margin: 0;
    background-image: var(--kora-gradient);
    opacity: 0.85;
  }

  .cuerpo {
    margin: 0;
    max-width: 34ch;
    font-size: clamp(1rem, 3.6vw, 1.125rem);
    line-height: 1.65;
    color: rgba(249, 243, 238, 0.74);
    text-wrap: balance;
  }

  .cierre {
    margin: 0;
    font-size: clamp(0.95rem, 3.4vw, 1.05rem);
    line-height: 1.6;
    color: rgba(249, 243, 238, 0.92);
    max-width: 22ch;
    /* Reparte las líneas en vez de dejar una palabra huérfana al final. */
    text-wrap: balance;
  }

  .cierre strong {
    font-weight: 800;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 1.75rem 1.5rem 2.25rem;
    text-align: center;
    font-size: 0.8125rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(249, 243, 238, 0.45);
  }


  /* Contador de apertura: tarjetas partidas al estilo de un marcador de
     aeropuerto, en los neutros de la marca. El gradiente solo en el filo. */
  .contador {
    display: flex;
    gap: clamp(0.5rem, 2.5vw, 1.25rem);
    margin: 0;
  }
  .contador[hidden] { display: none; }
  .unidad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
  }
  .tarjeta {
    position: relative;
    width: clamp(3.9rem, 19vw, 7.25rem);
    aspect-ratio: 1 / 1.05;
    border-radius: clamp(0.6rem, 2vw, 1rem);
    background: linear-gradient(180deg, #1f1f1f 0%, #1a1a1a 49.6%, #151515 50.4%, #111 100%);
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  /* El pliegue y sus dos bisagras. */
  .tarjeta::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: rgba(0, 0, 0, 0.85);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
    z-index: 2;
  }
  .tarjeta::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 2px;
    background-image: var(--kora-gradient);
    opacity: 0.7;
  }
  .digitos {
    font-weight: 800;
    font-size: clamp(2rem, 10vw, 3.9rem);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--kora-beige);
    line-height: 1;
  }
  .etiqueta {
    font-size: clamp(0.62rem, 2.4vw, 0.8rem);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(249, 243, 238, 0.6);
  }
  .fecha {
    margin: -1rem 0 0;
    font-size: clamp(0.8rem, 3vw, 0.95rem);
    letter-spacing: 0.08em;
    color: rgba(249, 243, 238, 0.6);
  }
  @media (prefers-reduced-motion: no-preference) {
    .digitos.cambia { animation: pliegue 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes pliegue {
      from { transform: perspective(300px) rotateX(-70deg); opacity: 0.2; }
      to   { transform: none; opacity: 1; }
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    main > * {
      animation: entrada 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    main > *:nth-child(1) { animation-delay: 0.05s; }
    main > *:nth-child(2) { animation-delay: 0.14s; }
    main > *:nth-child(3) { animation-delay: 0.23s; }
    main > *:nth-child(4) { animation-delay: 0.30s; }
    main > *:nth-child(5) { animation-delay: 0.37s; }
    main > *:nth-child(6) { animation-delay: 0.44s; }
    main > *:nth-child(7) { animation-delay: 0.50s; }
    main > *:nth-child(8) { animation-delay: 0.56s; }

    @keyframes entrada {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
  }

  @media (min-width: 768px) {
    main { gap: 2.5rem; padding-top: 4rem; }
  }
</style>
</head>
<body>

<main>
  <img class="logo" src="/logo-kora.png" alt="KORA" width="1800" height="467">

  <h1 class="titular">Esto apenas <em>comienza.</em></h1>

  <p class="bajada">
    <span class="linea-uno">Todo lo que buscas,</span>
    <span class="linea-dos">en un solo lugar.</span>
  </p>

  <hr class="separador">

  <div class="contador" id="contador" data-apertura="2026-10-05T19:30:00-05:00" role="timer" aria-label="Tiempo para la apertura de la tienda" hidden>
    <div class="unidad"><div class="tarjeta"><span class="digitos" data-u="d">00</span></div><span class="etiqueta">Días</span></div>
    <div class="unidad"><div class="tarjeta"><span class="digitos" data-u="h">00</span></div><span class="etiqueta">Horas</span></div>
    <div class="unidad"><div class="tarjeta"><span class="digitos" data-u="m">00</span></div><span class="etiqueta">Minutos</span></div>
    <div class="unidad"><div class="tarjeta"><span class="digitos" data-u="s">00</span></div><span class="etiqueta">Segundos</span></div>
  </div>

  <p class="fecha" id="fecha">Abrimos el lunes 5 de octubre, 7:30 p. m.</p>

  <p class="cuerpo">Estamos preparando cada detalle para abrir nuestra tienda en línea.</p>

  <p class="cierre">Pequeños detalles, <strong>grandes recuerdos.</strong></p>
</main>

<footer>Colombia · Estados Unidos</footer>


<script>
  // Sin JavaScript la página sigue diciendo la fecha; el contador es un añadido.
  (function () {
    var caja = document.getElementById("contador");
    var fecha = document.getElementById("fecha");
    var apertura = Date.parse(caja.getAttribute("data-apertura"));
    if (isNaN(apertura)) return;
    var celdas = {};
    ["d", "h", "m", "s"].forEach(function (u) { celdas[u] = caja.querySelector('[data-u="' + u + '"]'); });
    var dos = function (n) { return n < 10 ? "0" + n : String(n); };
    function pintar(u, valor) {
      var el = celdas[u];
      if (el.textContent === valor) return;
      el.textContent = valor;
      el.classList.remove("cambia");
      void el.offsetWidth; // reinicia la animación
      el.classList.add("cambia");
    }
    function tic() {
      var falta = Math.max(0, Math.floor((apertura - Date.now()) / 1000));
      if (falta === 0) {
        caja.hidden = true;
        fecha.textContent = "Estamos abriendo las puertas. Vuelve en unos minutos.";
        return false;
      }
      pintar("d", dos(Math.floor(falta / 86400)));
      pintar("h", dos(Math.floor(falta % 86400 / 3600)));
      pintar("m", dos(Math.floor(falta % 3600 / 60)));
      pintar("s", dos(falta % 60));
      return true;
    }
    if (tic()) {
      caja.hidden = false;
      var t = setInterval(function () { if (!tic()) clearInterval(t); }, 1000);
    }
  })();
</script>
</body>
</html>
