# Entorno de PRUEBAS. Ver openspec/changes/vps-two-stack-deploy.
#
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
#
# El `--env-file` es necesario para que se resuelvan las ETIQUETAS DE IMAGEN
# (KORA_IMAGE, KORA_MIGRATOR_IMAGE) que escribe el despliegue automático. El
# resto de servicios funciona con o sin él: sus variables entran por `env_file`,
# que es cosa distinta y sí lee del archivo indicado.
#
# El aislamiento respecto a producción es ESTRUCTURAL, no una convención:
# la base y la caché viven solo en `interna`, una red que producción no
# comparte y que no publica ningún puerto al servidor. Desde un contenedor de
# producción el nombre `postgres` de este entorno sencillamente no resuelve —
# el fallo es de red, no de credenciales (specs/environment-isolation).
#
# La aplicación toca DOS redes: la interna, para hablar con su base, y la de
# frontera, para que el borde la alcance. Nunca la del otro entorno.

name: kora-staging

services:
  app:
    image: ${KORA_IMAGE:-kora-app:latest}
    # Nombre fijo: es el que resuelve el `reverse_proxy` del Caddyfile.
    container_name: kora-staging-app
    restart: unless-stopped
    # Las imágenes de producto viven aquí, y TIENE que ser un volumen.
    # Sin él viven en la capa efímera del contenedor: se escriben sin error y
    # `up -d --force-recreate` las borra todas, dejando la tienda con el
    # catálogo completo y ninguna foto. La aplicación lo comprueba al arrancar
    # (src/modules/storage/persistence.ts) y se niega a levantar si detecta
    # que la base registra imágenes y el directorio está vacío.
    volumes:
      - uploads:/data/uploads
    # El almacenamiento de PRUEBAS se declara aquí y no en `.env.staging`
    # porque este archivo SÍ viaja en cada despliegue: así el entorno queda
    # completo sin que nadie tenga que entrar por SSH a añadir dos líneas.
    #
    # No es un valor por defecto escondido en el código —eso es justo lo que se
    # eliminó— sino una elección explícita, versionada y revisable en un diff.
    # Producción declara la suya en `.env.production`, deliberadamente aparte.
    #
    # Efecto lateral bienvenido: las imágenes de producto empiezan a cargar en
    # pruebas. Hasta ahora nunca lo hicieron, porque el entorno apuntaba a R2
    # con credenciales de relleno.
    environment:
      KORA_STORAGE_DRIVER: disk
      KORA_UPLOADS_DIR: /data/uploads
      # La dirección pública de PRUEBAS. Sin ella, `storeUrl()` cae al valor
      # por defecto —korashopp.com, la página de espera— y todo enlace y toda
      # foto de los correos que salen de pruebas apuntan a producción: el
      # "Compra ahora" de la campaña llevaba a "muy pronto" (13 sep 2026).
      # Va aquí y no en `.env.staging` por la misma razón que el
      # almacenamiento: este archivo sí viaja en cada despliegue.
      NEXT_PUBLIC_STORE_URL: https://test.korashopp.com
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1024m
    cpus: 1.0
    networks:
      - interna
      - frontera

  postgres:
    image: postgres:16-alpine
    container_name: kora-staging-postgres
    restart: unless-stopped
    # `env_file` y NO `environment: ${POSTGRES_PASSWORD}`: la sustitución
    # `${VAR}` dentro de un compose NO lee de `env_file` —lee del shell o de un
    # archivo llamado exactamente `.env`—, así que la contraseña llegaba vacía y
    # PostgreSQL se negaba a inicializar. Con `env_file` las variables entran
    # directamente al contenedor, sin depender de recordar ningún flag.
    env_file:
      - .env.staging
    # Sin `ports`: la base NO se expone al servidor ni a internet. Se llega a
    # ella únicamente desde la red interna de este entorno.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapa el signo para que lo resuelva el shell DENTRO del contenedor
      # y no la sustitución de compose, que aquí tampoco tendría los valores.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
    cpus: 1.0
    networks:
      - interna

  redis:
    image: redis:7-alpine
    container_name: kora-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 128m
    cpus: 0.5
    networks:
      - interna

  # Consumidor de la bandeja de salida de eventos de dominio.
  # Proceso aparte y no un hilo del servidor web: dentro de la aplicación
  # competiría por memoria con las peticiones de los compradores, se
  # multiplicaría al escalar réplicas y no podría reiniciarse sin cortar el
  # tráfico.
  #
  # Imagen PROPIA y no la de la aplicación: `runner` es la salida standalone de
  # Next, sin `tsx` ni `scripts/`. Sale del mismo Dockerfile, objetivo `worker`.
  worker:
    image: ${KORA_WORKER_IMAGE:-kora-worker:latest}
    container_name: kora-staging-worker
    restart: unless-stopped
    env_file:
      - .env.staging
    # Las mismas variables de almacenamiento que `app`. El worker no sirve
    # imágenes, pero desde el 28 ago 2026 comprueba al arrancar las MISMAS
    # guardas de configuración que la aplicación, y "entorno completo" tiene que
    # significar lo mismo para los dos procesos. Partir esa definición en dos
    # es exactamente cómo el worker acabó subiendo sano en una producción sin
    # correo configurado.
    #
    environment:
      KORA_STORAGE_DRIVER: disk
      KORA_UPLOADS_DIR: /data/uploads
      # La dirección pública de PRUEBAS. Sin ella, `storeUrl()` cae al valor
      # por defecto —korashopp.com, la página de espera— y todo enlace y toda
      # foto de los correos que salen de pruebas apuntan a producción: el
      # "Compra ahora" de la campaña llevaba a "muy pronto" (13 sep 2026).
      # Va aquí y no en `.env.staging` por la misma razón que el
      # almacenamiento: este archivo sí viaja en cada despliegue.
      NEXT_PUBLIC_STORE_URL: https://test.korashopp.com
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    # ⚠️ UN solo bloque `volumes`: YAML no admite la clave dos veces y compose
    # rechaza el archivo entero — el despliegue del 12 sep falló por eso, con
    # el mensaje escondido en el paso de migración.
    volumes:
      # El MISMO volumen de imágenes que la app. El worker no las sirve, pero
      # es donde corre `pnpm photos:import` en el servidor (tiene tsx y
      # scripts; la imagen de la app no): sin el volumen, subiría las fotos a
      # su capa efímera y el siguiente despliegue las borraría.
      - uploads:/data/uploads
      # En PRUEBAS el correo NO sale a internet salvo a la lista permitida: el
      # resto se escribe aquí y se lee. Para leerlos:
      #   docker exec kora-staging-worker ls /emails
      - correos:/emails
    networks:
      - interna
      # ⚠️ `salida` ES OBLIGATORIA: el worker es quien ENVÍA los correos y
      # `interna` no tiene internet. Sin esta red, cada correo muere con
      # `fetch failed` tras 5 intentos y el evento queda muerto en la bandeja:
      # nadie recibe confirmación ni cambios de estado, y la tienda responde
      # 200. Pasó en pruebas el 13 sep 2026: en local nunca se notó porque el
      # correo de desarrollo se escribe a disco y no necesita salir.
      - salida

  # Contenedor efímero: aplica migraciones y termina. Se ejecuta como PASO PREVIO
  # del despliegue, nunca al arrancar la aplicación — si falla, el despliegue se
  # detiene y la versión anterior sigue sirviendo
  # (specs/continuous-deployment).
  #
  #   docker compose -f docker-compose.staging.yml run --rm migrate
  migrate:
    image: ${KORA_MIGRATOR_IMAGE:-kora-migrator:latest}
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    mem_limit: 512m
    networks:
      - interna

volumes:
  pgdata:
  redisdata:
  # Imágenes de producto. Ver el comentario del servicio `app`.
  uploads:
  # Los correos que el worker escribe en pruebas, para poder abrirlos.
  correos:

networks:
  # `internal: true` corta el acceso a internet de esta red: la base y la caché
  # no salen a ningún lado, ni aunque alguien lo intente.
  interna:
    name: kora-staging-interna
    internal: true
  # Solo para el worker: egreso a internet (Resend) sin exponerlo a nadie.
  # No va en `frontera` a propósito: esa es la red del borde (Caddy) y el
  # worker no atiende peticiones de nadie.
  salida:
    name: kora-staging-salida
  frontera:
    external: true
    name: kora-edge-staging
